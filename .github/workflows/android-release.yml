name: Build signed Android release

# Deliberately manual: commits and pull requests do not spend runner minutes.
on:
  workflow_dispatch:
    inputs:
      publish_privacy:
        description: Publish privacy policy to GitHub Pages
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Test, inspect and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease bundleRelease assembleRelease --console=plain
      - name: Package upload files
        id: package
        run: |
          version=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p release-output
          cp app/build/outputs/bundle/release/app-release.aab "release-output/adb-local-shell-pro-$version.aab"
          cp app/build/outputs/apk/release/app-release.apk "release-output/adb-local-shell-pro-$version.apk"
          cp app/build/outputs/mapping/release/mapping.txt release-output/
          cd release-output && sha256sum *.aab *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: adb-local-shell-pro-${{ steps.package.outputs.version }}
          path: release-output/
          retention-days: 14
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/configure-pages@v5
        if: inputs.publish_privacy
      - uses: actions/upload-pages-artifact@v3
        if: inputs.publish_privacy
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: pages
        if: inputs.publish_privacy
      - name: Remove runner signing key
        if: always()
        run: rm -f -- "$KEYSTORE_PATH"
